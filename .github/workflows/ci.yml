name: ci
# Read-only baseline checks for this public repo. No secrets, no deploys, no writes.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0             # full history for the secret scan
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Secret scan (entire history; reviewed false positives in .gitleaksignore)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: JavaScript parses
        run: |
          set -e
          n=0
          while IFS= read -r f; do node --check "$f"; n=$((n+1)); done < <(git ls-files '*.js' '*.cjs' '*.mjs' | grep -v '/vendor/')
          echo "parsed $n files"
