    <div class="search" role="search">
      <input id="q" type="search" role="combobox" aria-controls="results" aria-expanded="false" aria-autocomplete="list" aria-haspopup="listbox" placeholder="Find a neuron…" autocomplete="off" aria-label="Search neurons and synapses">
      <ul id="results" class="results" role="listbox" hidden></ul>
    </div>

    <div class="stats" id="stats" aria-live="polite"></div>

  <aside id="lobes" aria-label="Lobes">
    <div class="lobes-head">Lobes</div>
    <div id="lobe-list"></div>
    <div class="switches">
      <label class="switch"><input type="checkbox" id="explode-all"><span>Explode every neuron</span></label>
      <label class="switch"><input type="checkbox" id="cocite"><span>Shared-source threads</span></label>
    </div>
  </aside>

  <aside id="connectome" class="connectome" aria-label="Connectome">
    <button class="cx-head" id="cx-head" aria-expanded="false"><span>Connectome</span><span class="chev" aria-hidden="true">▸</span></button>
    <div class="cx-body-wrap">
      <div id="cx-body"></div>
      <div class="cx-controls">
        <label class="slider"><span>Synaptic pruning <output id="prune-out">all wires</output></span><input type="range" id="prune" min="10" max="100" value="100" step="5" aria-label="Keep the strongest share of wires"></label>
        <label class="switch"><input type="checkbox" id="tg-activity" checked><span>Spiking activity</span></label>
        <label class="switch"><input type="checkbox" id="tg-learning" checked><span>Learn from my navigation</span></label>
        <label class="switch"><input type="checkbox" id="tg-communities"><span>Colour by detected community</span></label>
        <label class="switch"><input type="checkbox" id="tg-hubs" checked><span>Hub &amp; rich-club rings</span></label>
        <button class="btn sm" id="reset-learning">Forget learned weights</button>
      </div>
    </div>
  </aside>

  <div id="level" class="level" aria-live="polite">
    <span class="dot"></span><span id="level-text">Lobes</span>
    <span class="hint" id="hint">scroll to zoom · drag to select · click a neuron</span>
  </div>

  <div id="tools" class="zoom-ctl tools" role="group" aria-label="Tools">
    <button class="tool-mode on" data-mode="select" title="Select & move (V): drag a box to select neurons, drag neurons to move them; mouse3 or Space pans" aria-label="Select and move tool">⬚</button>
    <button class="tool-mode" data-mode="pan" title="Pan (H): drag to pan the view" aria-label="Pan tool">✋</button>
    <button id="release-pins" title="Release hand-placed neurons (R)" aria-label="Release hand-placed neurons">⟲</button>
  </div>
  <div id="zoom-ctl" class="zoom-ctl" role="group" aria-label="Zoom">
    <button id="z-in" aria-label="Zoom in">+</button>
    <button id="z-out" aria-label="Zoom out">−</button>
    <button id="z-fit" aria-label="Fit whole brain" title="Fit whole brain">⌂</button>
  </div>

  <!-- the mice's chat (js/mice-chat.js): what they are building, and a place to ask them; the cheese above Don't Panic switches them off and on -->
  <aside id="mice-chat" class="mice-chat" aria-label="The mice">
    <button id="mice-btn" class="mice-head" type="button" aria-expanded="false" aria-controls="mice-body" title="The mice: Frankie and Benjy build their own neurons, networks and brains onto the Guide’s, and answer questions. Press to open or close their chat; the cheese switches them off (M).">
      <span class="dot" aria-hidden="true"></span><span class="who">The mice</span><output id="mice-out" aria-live="off"></output><span class="chev" aria-hidden="true"></span>
    </button>
    <div id="mice-body" class="mice-body">
      <ol id="mice-log" class="mice-log" aria-live="polite" aria-label="The mice’s chat"></ol>
      <div id="mice-starters" class="mice-starters" aria-label="Things to ask"></div>
      <form id="mice-ask" class="mice-composer" autocomplete="off">
        <input id="mice-q" type="text" name="q" placeholder="Ask the mice…" aria-label="Ask the mice" maxlength="200" autocomplete="off" enterkeyhint="send">
        <button type="submit" class="mice-send" aria-label="Ask">Ask <span aria-hidden="true">↑</span></button>
      </form>
      <div class="mice-foot"><span class="hint">Enter to ask · the mice answer from the Guide’s brain and their own lab notes</span><button id="mice-clear" class="mice-home" type="button" title="Send the mice home: forget everything they built in this browser and reload">Send them home</button></div>
    </div>
  </aside>
  <button id="mice-toggle" class="mice-cheese" type="button" aria-pressed="true" title="The mice are on (M). Press to switch them off: they stop building and their chat is put away. Their networks stay." aria-label="Switch the mice off or on" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.6 19.8 5.3c1-.3 2 .4 2 1.4v2.4L3 14.3z" fill="#ffe08a"/><path d="M3 14.3 21.8 9.1v7.4a1.2 1.2 0 0 1-1.2 1.2H4.2A1.2 1.2 0 0 1 3 16.5z" fill="#f4b73a"/><circle cx="7.6" cy="15.2" r="1.35" fill="#c7861c"/><circle cx="12.8" cy="13.6" r="1" fill="#c7861c"/><circle cx="17.4" cy="14.6" r="1.2" fill="#c7861c"/><circle cx="10.6" cy="9.2" r=".75" fill="#e9bd4c"/><circle cx="15.8" cy="7.7" r=".55" fill="#e9bd4c"/></svg>
  </button>

  <div id="tip" class="tip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <aside id="panel" class="panel" hidden aria-label="Details">
    <button class="close" id="panel-close" aria-label="Close details">×</button>
    <div id="panel-body"></div>
  </aside>

  <div id="loading" class="loading"><div class="pulse"></div><span>Opening the Guide…</span></div>
